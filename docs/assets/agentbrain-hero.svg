<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" fill="none" aria-labelledby="title desc" role="img" viewBox="0 0 1200 560"><title id="title">Agent Brain architecture banner</title><desc id="desc">Dark architecture diagram showing a coding agent routed through Agent Brain commands, skills, schemas, templates, evals, and verification evidence.</desc><defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path stroke="#1e293b" stroke-width="1" d="M40 0H0V40" opacity=".55"/></pattern><marker id="arrow-cyan" markerHeight="12" markerWidth="12" orient="auto" refX="10" refY="6"><path fill="#22d3ee" d="M2 2L10 6L2 10Z"/></marker><marker id="arrow-emerald" markerHeight="12" markerWidth="12" orient="auto" refX="10" refY="6"><path fill="#34d399" d="M2 2L10 6L2 10Z"/></marker><marker id="arrow-amber" markerHeight="12" markerWidth="12" orient="auto" refX="10" refY="6"><path fill="#fbbf24" d="M2 2L10 6L2 10Z"/></marker></defs><style>.bg{fill:#020617}.panel,.panel-soft{fill:#0f172a;stroke:#334155;stroke-width:1.5}.panel-soft{fill:#111c31;stroke-width:1.25}.box{fill:#0b1220;stroke:#475569;stroke-width:1.4}.box-cyan{fill:#083344;stroke:#22d3ee;stroke-width:1.5}.box-emerald,.box-violet{fill:#052e2b;stroke:#34d399;stroke-width:1.5}.box-violet{fill:#21133f;stroke:#a78bfa}.box-amber,.box-rose{fill:#422006;stroke:#fbbf24;stroke-width:1.5}.box-rose{fill:#3b101f;stroke:#fb7185}.ink{fill:#f8fafc}.muted{fill:#94a3b8}.dim{fill:#64748b}.cyan{fill:#22d3ee}.emerald{fill:#34d399}.amber{fill:#fbbf24}.rose{fill:#fb7185}.label{font:700 44px ui-sans-serif,-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif}.section{font:750 13px ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;letter-spacing:.08em}.body{font:600 17px ui-sans-serif,-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif}.small{font:600 13px ui-sans-serif,-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif}.mono{font:700 15px ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace}.tiny{font:700 12px ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;letter-spacing:.05em}.flow-amber,.flow-cyan,.flow-emerald{stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}.flow-cyan,.flow-emerald{stroke:#22d3ee;marker-end:url(#arrow-cyan)}.flow-emerald{stroke:#34d399;marker-end:url(#arrow-emerald)}.flow-amber{stroke:#fbbf24;marker-end:url(#arrow-amber)}.dash{stroke-dasharray:7 9}</style><rect width="1200" height="560" class="bg" rx="18"/><rect width="1200" height="560" fill="url(#grid)" opacity=".7"/><rect width="1152" height="512" x="24" y="24" fill="#07111f" stroke="#1e293b" stroke-width="1.5" rx="14"/><g><text x="0" y="0" class="section cyan" transform="translate(64 54)">REPO-LOCAL OPERATING HARNESS</text><text x="0" y="50" class="label ink" transform="translate(64 54)">Agent Brain</text><text x="0" y="82" class="body muted" transform="translate(64 54)">Commands, skills, schemas, templates, evals, and proof gates.</text></g><g opacity=".95"><path d="M318 328H392" class="flow-cyan"/><path d="M808 328H882" class="flow-emerald"/><path d="M604 450C604 474 690 486 780 486H882" class="flow-amber dash"/></g><g transform="translate(64 178)"><rect width="254" height="300" x="0" y="0" class="panel" rx="10"/><text x="24" y="38" class="section cyan">AGENT RUNTIME</text><text x="24" y="70" class="body ink">Agent reads repo</text><text x="24" y="96" class="small muted">then uses local commands as</text><text x="24" y="116" class="small muted">work contract.</text><g transform="translate(24 162)"><rect width="206" height="42" x="0" y="0" class="box-cyan" rx="7"/><circle cx="23" cy="21" r="6" class="cyan"/><text x="44" y="27" class="mono ink">read context</text></g><g transform="translate(24 220)"><rect width="206" height="42" x="0" y="0" class="box" rx="7"/><circle cx="23" cy="21" r="6" class="dim"/><text x="44" y="27" class="mono ink">use tools</text></g></g><g transform="translate(392 178)"><rect width="416" height="300" x="0" y="0" class="panel" rx="10"/><rect width="372" height="72" x="22" y="24" class="panel-soft" rx="8"/><text x="44" y="50" class="section emerald">AGENT BRAIN</text><text x="44" y="74" class="small muted">Repo-local state, artifacts, checks,</text><text x="44" y="92" class="small muted">and handoff rules.</text><g transform="translate(34 120)"><rect width="164" height="58" x="0" y="0" class="box-cyan" rx="8"/><text x="20" y="26" class="tiny cyan">COMMANDS</text><text x="20" y="46" class="mono ink">/brain-start</text></g><g transform="translate(218 120)"><rect width="164" height="58" x="0" y="0" class="box-emerald" rx="8"/><text x="20" y="26" class="tiny emerald">SKILLS</text><text x="20" y="46" class="mono ink">local playbooks</text></g><g transform="translate(34 194)"><rect width="164" height="58" x="0" y="0" class="box-violet" rx="8"/><text x="20" y="26" fill="#a78bfa" class="tiny">SCHEMAS</text><text x="20" y="46" class="mono ink">valid artifacts</text></g><g transform="translate(218 194)"><rect width="164" height="58" x="0" y="0" class="box-amber" rx="8"/><text x="20" y="26" class="tiny amber">TEMPLATES</text><text x="20" y="46" class="mono ink">review shape</text></g><g transform="translate(126 252)"><rect width="164" height="38" x="0" y="0" class="box-rose" rx="8"/><text x="20" y="25" class="mono ink">/brain-verify</text></g></g><g transform="translate(882 178)"><rect width="254" height="300" x="0" y="0" class="panel" rx="10"/><text x="24" y="38" class="section emerald">VERIFIED WORK</text><text x="24" y="70" class="body ink">Work leaves with proof</text><text x="24" y="96" class="small muted">so review starts from proof,</text><text x="24" y="116" class="small muted">not chat momentum.</text><g transform="translate(24 156)"><rect width="206" height="38" x="0" y="0" class="box-emerald" rx="7"/><text x="20" y="25" class="mono ink">artifact</text></g><g transform="translate(24 204)"><rect width="206" height="38" x="0" y="0" class="box-amber" rx="7"/><text x="20" y="25" class="mono ink">evidence</text></g><g transform="translate(24 252)"><rect width="206" height="38" x="0" y="0" class="box" rx="7"/><text x="20" y="25" class="mono ink">handoff</text></g></g><g transform="translate(64 502)"><rect width="1072" height="30" x="0" y="0" fill="#0b1220" stroke="#1e293b" stroke-width="1" rx="7"/><text x="22" y="20" class="tiny dim">raw request</text><text x="162" y="20" class="tiny cyan">state</text><text x="278" y="20" class="tiny emerald">command</text><text x="424" y="20" fill="#a78bfa" class="tiny">skill</text><text x="552" y="20" class="tiny amber">artifact</text><text x="704" y="20" class="tiny rose">evidence</text><text x="866" y="20" class="tiny muted">handoff</text><path stroke="#475569" stroke-linecap="round" stroke-width="1.5" d="M112 15H142M212 15H252M356 15H400M486 15H528M638 15H680M798 15H842"/></g></svg>